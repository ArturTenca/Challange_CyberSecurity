<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ford Challenge – Localhost</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #080a0e;
      color: #e8eaed;
      margin: 0;
      padding: 2rem;
      line-height: 1.5;
    }
    h1 { color: #2d7dd2; margin-top: 0; }
    .card {
      background: #12151c;
      border: 1px solid #2a3142;
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      max-width: 640px;
    }
    label { display: block; margin: 0.5rem 0 0.25rem; font-size: 0.9rem; color: #9aa0a6; }
    input, button, select {
      width: 100%;
      padding: 0.6rem;
      border-radius: 8px;
      border: 1px solid #3c4458;
      background: #1a1f2a;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    button {
      background: #2d7dd2;
      border: none;
      cursor: pointer;
      font-weight: 600;
      margin-top: 0.5rem;
    }
    button:hover { background: #256bb8; }
    pre {
      background: #0d1016;
      padding: 1rem;
      border-radius: 8px;
      overflow: auto;
      font-size: 0.8rem;
      max-height: 280px;
    }
    .ok { color: #4ade80; }
    .links a { color: #60a5fa; margin-right: 1rem; }
    .badge { display: inline-block; background: #1e3a5f; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; }
  </style>
</head>
<body>
  <h1>Ford Challenge – Localhost</h1>
  <p class="links">
    <span class="badge" id="apiStatus">API...</span>
    <a href="/health" target="_blank">/health</a>
  </p>

  <div class="card">
    <h2>Login (JWT)</h2>
    <label>Email</label>
    <select id="email">
      <option value="admin@ford.demo">admin@ford.demo (admin)</option>
      <option value="analista@ford.demo">analista@ford.demo (analista)</option>
      <option value="usuario@ford.demo">usuario@ford.demo (usuário)</option>
    </select>
    <label>Senha</label>
    <input id="password" type="password" value="Ford@2026" />
    <button type="button" id="btnLogin">Entrar</button>
  </div>

  <div class="card">
    <h2>Ações</h2>
    <button type="button" id="btnVehicles">Buscar veículos (Ford / Ranger Raptor / 2026)</button>
    <button type="button" id="btnLead">Criar lead de teste (assinado HMAC)</button>
    <button type="button" id="btnAudit">Ver auditoria (admin)</button>
  </div>

  <div class="card">
    <h2>Resposta</h2>
    <pre id="out">Aguardando...</pre>
  </div>

  <script>
    const API = window.location.origin;
    const out = document.getElementById('out');
    let accessToken = null;
    const HMAC_SECRET = 'dev-hmac-secret-min-32-characters-long!!';

    async function hmacSign(message) {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey(
        'raw', enc.encode(HMAC_SECRET), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
      );
      const sig = await crypto.subtle.sign('HMAC', key, enc.encode(message));
      return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function show(data) {
      out.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    }

    fetch(API + '/health')
      .then(r => r.json())
      .then(d => {
        document.getElementById('apiStatus').textContent = 'API online';
        document.getElementById('apiStatus').className = 'badge ok';
        show({ health: d, baseUrl: API });
      })
      .catch(() => {
        document.getElementById('apiStatus').textContent = 'API offline';
        show('Erro: API não responde em ' + API);
      });

    document.getElementById('btnLogin').onclick = async () => {
      const res = await fetch(API + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (res.ok) accessToken = data.accessToken;
      show(data);
    };

    document.getElementById('btnVehicles').onclick = async () => {
      if (!accessToken) return show('Faça login primeiro.');
      const q = 'marca=Ford&modelo=Ranger%20Raptor&versao=2026';
      const res = await fetch(API + '/api/vehicles?' + q, {
        headers: { Authorization: 'Bearer ' + accessToken },
      });
      show(await res.json());
    };

    document.getElementById('btnLead').onclick = async () => {
      if (!accessToken) return show('Faça login primeiro.');
      const body = {
        customerName: 'Cliente Teste',
        customerEmail: 'teste@ford.demo',
        customerPhone: '11999990000',
        vehicleInterest: 'Ranger Raptor',
      };
      const serialized = JSON.stringify(body);
      const ts = String(Date.now());
      const sig = await hmacSign(ts + '.' + serialized);
      const res = await fetch(API + '/api/leads', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + accessToken,
          'X-Payload-Signature': sig,
          'X-Payload-Timestamp': ts,
        },
        body: serialized,
      });
      show(await res.json());
    };

    document.getElementById('btnAudit').onclick = async () => {
      if (!accessToken) return show('Faça login primeiro (use admin).');
      const res = await fetch(API + '/api/admin/audit?limit=10', {
        headers: { Authorization: 'Bearer ' + accessToken },
      });
      show(await res.json());
    };
  </script>
</body>
</html>
